[package]
name = "audit-registry"
version = "0.1.0"
edition = "2021"
description = "HADES OMEGA — Immutable audit hash registry for NEAR Testnet"
license = "MIT"
repository = "https://github.com/dyann1984/hades-omega"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.1.0"

[dev-dependencies]
near-sdk = { version = "5.1.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
