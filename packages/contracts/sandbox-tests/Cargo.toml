[package]
name = "hades-audit-registry-sandbox-tests"
version = "0.0.0"
edition = "2021"
publish = false
description = "Integration tests that run the compiled release WASM inside a local near-sandbox (no testnet, no funds)"

# Separate crate and lockfile on purpose: the contract's own Cargo.lock (and therefore its attested WASM) is not touched.
[workspace]

[dev-dependencies]
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
